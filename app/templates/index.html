{% extends "base.html" %}
{% block content %}
<div class="container-fluid">
    <h2 class="mb-4">🏥 ООО «КОМПАНИЯ «ФЕСФАРМ»</h2>

    <div class="card mb-4">
        <div class="card-body">
            <div class="row">
                <div class="col-md-3">
                    <label for="branchSelect" class="form-label">Филиал</label>
                    <select id="branchSelect" class="form-select">
                        <option value="">Все филиалы</option>
                        {% for branch in branches %}
                        <option value="{{ branch.id }}">{{ branch.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-3">
                    <label for="locationSelect" class="form-label">Отделение</label>
                    <select id="locationSelect" class="form-select" disabled>
                        <option value="">Сначала выберите филиал</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label for="doctorSelect" class="form-label">Врач</label>
                    <select id="doctorSelect" class="form-select">
                        <option value="">Все врачи</option>
                        {% for doctor in doctors %}
                        <option value="{{ doctor.id }}">{{ doctor.last_name }} {{ doctor.first_name }} {{ doctor.patronymic or '' }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-3">
                    <label for="searchInput" class="form-label">Поиск по ФИО</label>
                    <input type="text" id="searchInput" class="form-control" placeholder="Введите фамилию или имя">
                </div>
            </div>

            <div class="row mt-3">
                <div class="col-md-4">
                    <label for="periodSelect" class="form-label">Период</label>
                    <select id="periodSelect" class="form-select">
                        <option value="all">Все приёмы</option>
                        <option value="today">Сегодня</option>
                        <option value="week">Последние 7 дней</option>
                        <option value="month">Последние 30 дней</option>
                        <option value="year">Последний год</option>
                        <option value="oldest">Сначала старые</option>
                        <option value="newest">Сначала новые</option>
                    </select>
                </div>
                <div class="col-md-8">
                    <div class="d-flex justify-content-between align-items-end h-100">
                        <div>
                            <button id="filterBtn" class="btn btn-primary me-2">Применить фильтры</button>
                            <button id="resetBtn" class="btn btn-secondary">Сбросить</button>
                        </div>
                        <div>
                            <a href="/new-patient" class="btn btn-success">Создать первичный прием</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="card">
        <div class="card-header">
            <h5>📋 Список приёмов</h5>
        </div>
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-striped table-hover">
                    <thead class="table-dark">
                        <tr>
                            <th>Пациент</th>
                            <th>Возраст</th>
                            <th>Дата приёма</th>
                            <th>Врач</th>
                            <th>Отделение</th>
                            <th>Филиал</th>
                            <th>ЭМК</th>
                        </tr>
                    </thead>
                    <tbody id="appointmentsBody">
                        <tr><td colspan="7" class="text-center">Загрузка данных...</td></tr>
                    </tbody>
                </table>
            </div>

            <div id="appointmentsPagination" class="d-flex flex-wrap justify-content-between align-items-center gap-2 mt-3">
                <div id="appointmentsPageInfo" class="text-muted" aria-live="polite">Загрузка данных...</div>
                <div class="btn-group" role="group" aria-label="Страницы списка приёмов">
                    <button id="appointmentsPrevBtn" type="button" class="btn btn-outline-secondary" disabled>← Назад</button>
                    <button id="appointmentsNextBtn" type="button" class="btn btn-outline-secondary" disabled>Дальше →</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const PAGE_SIZE = 100;
    let currentPage = 0;
    let totalAppointments = 0;
    let appointmentsRequestController = null;

    const branchSelect = document.getElementById('branchSelect');
    const locationSelect = document.getElementById('locationSelect');
    const doctorSelect = document.getElementById('doctorSelect');
    const searchInput = document.getElementById('searchInput');
    const periodSelect = document.getElementById('periodSelect');
    const appointmentsBody = document.getElementById('appointmentsBody');
    const pageInfo = document.getElementById('appointmentsPageInfo');
    const prevPageBtn = document.getElementById('appointmentsPrevBtn');
    const nextPageBtn = document.getElementById('appointmentsNextBtn');

    function doctorName(doctor) {
        return `${doctor.last_name || ''} ${doctor.first_name || ''} ${doctor.patronymic || ''}`.trim();
    }

    function escapeHtml(value) {
        return String(value ?? '')
            .replaceAll('&', '&amp;')
            .replaceAll('<', '&lt;')
            .replaceAll('>', '&gt;')
            .replaceAll('"', '&quot;')
            .replaceAll("'", '&#039;');
    }

    function fillSelect(select, items, placeholder, labelFunction, selectedValue = '') {
        select.innerHTML = '';
        const emptyOption = document.createElement('option');
        emptyOption.value = '';
        emptyOption.textContent = placeholder;
        select.appendChild(emptyOption);

        items.forEach(item => {
            const option = document.createElement('option');
            option.value = item.id;
            option.textContent = labelFunction(item);
            select.appendChild(option);
        });

        if (selectedValue) {
            const exists = Array.from(select.options).some(option => option.value === String(selectedValue));
            select.value = exists ? selectedValue : '';
        }
    }

    async function fetchJson(url) {
        const response = await fetch(url);
        if (!response.ok) {
            throw new Error(`Ошибка API: ${response.status}`);
        }
        return await response.json();
    }

    async function updateLocations(preserveSelected = true) {
        const branchId = branchSelect.value;
        const doctorId = doctorSelect.value;
        const currentLocationId = preserveSelected ? locationSelect.value : '';

        if (!branchId && !doctorId) {
            locationSelect.disabled = true;
            fillSelect(locationSelect, [], 'Сначала выберите филиал', item => item.name);
            return;
        }

        const params = new URLSearchParams();
        if (branchId) params.append('branch_id', branchId);
        if (doctorId) params.append('doctor_id', doctorId);

        locationSelect.disabled = false;
        locationSelect.innerHTML = '<option value="">Загрузка...</option>';

        try {
            const locations = await fetchJson(`/api/locations?${params.toString()}`);
            if (locations.length === 0) {
                fillSelect(locationSelect, [], 'Нет доступных отделений', item => item.name);
                return;
            }
            fillSelect(locationSelect, locations, 'Все отделения', location => location.name, currentLocationId);
        } catch (error) {
            console.error(error);
            fillSelect(locationSelect, [], 'Ошибка загрузки отделений', item => item.name);
        }
    }

    async function updateDoctors(preserveSelected = true) {
        const branchId = branchSelect.value;
        const locationId = locationSelect.value;
        const currentDoctorId = preserveSelected ? doctorSelect.value : '';
        const params = new URLSearchParams();

        if (branchId) params.append('branch_id', branchId);
        if (locationId) params.append('location_id', locationId);

        doctorSelect.innerHTML = '<option value="">Загрузка...</option>';

        try {
            const doctors = await fetchJson(`/api/doctors?${params.toString()}`);
            if (doctors.length === 0) {
                fillSelect(doctorSelect, [], 'Нет доступных врачей', doctorName);
                return;
            }
            fillSelect(doctorSelect, doctors, 'Все врачи', doctorName, currentDoctorId);
        } catch (error) {
            console.error(error);
            fillSelect(doctorSelect, [], 'Ошибка загрузки врачей', doctorName);
        }
    }

    function getPeriodParams() {
        let sortOrder = 'desc';
        let dateFrom = null;
        let dateTo = null;
        const today = new Date();

        function formatDate(value) {
            const year = value.getFullYear();
            const month = String(value.getMonth() + 1).padStart(2, '0');
            const day = String(value.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        if (periodSelect.value === 'today') {
            dateFrom = formatDate(today);
            dateTo = formatDate(today);
        } else if (periodSelect.value === 'week') {
            const weekAgo = new Date(today);
            weekAgo.setDate(today.getDate() - 7);
            dateFrom = formatDate(weekAgo);
            dateTo = formatDate(today);
        } else if (periodSelect.value === 'month') {
            const monthAgo = new Date(today);
            monthAgo.setDate(today.getDate() - 30);
            dateFrom = formatDate(monthAgo);
            dateTo = formatDate(today);
        } else if (periodSelect.value === 'year') {
            const yearAgo = new Date(today);
            yearAgo.setFullYear(today.getFullYear() - 1);
            dateFrom = formatDate(yearAgo);
            dateTo = formatDate(today);
        } else if (periodSelect.value === 'oldest') {
            sortOrder = 'asc';
        } else if (periodSelect.value === 'newest') {
            sortOrder = 'desc';
        }

        return {sortOrder, dateFrom, dateTo};
    }

    function buildAppointmentParams() {
        const params = new URLSearchParams();
        const periodParams = getPeriodParams();
        const search = searchInput.value.trim();

        if (branchSelect.value) params.append('branch_id', branchSelect.value);
        if (locationSelect.value) params.append('location_id', locationSelect.value);
        if (doctorSelect.value) params.append('doctor_id', doctorSelect.value);
        if (search) params.append('search', search);
        if (periodSelect.value) params.append('period', periodSelect.value);
        if (periodParams.dateFrom) params.append('date_from', periodParams.dateFrom);
        if (periodParams.dateTo) params.append('date_to', periodParams.dateTo);

        params.append('sort_order', periodParams.sortOrder);
        params.append('limit', String(PAGE_SIZE));
        params.append('offset', String(currentPage * PAGE_SIZE));
        return params;
    }

    function setPaginationLoading() {
        prevPageBtn.disabled = true;
        nextPageBtn.disabled = true;
        pageInfo.textContent = 'Загрузка данных...';
    }

    function updatePagination(loadedCount) {
        const totalPages = Math.max(1, Math.ceil(totalAppointments / PAGE_SIZE));
        const start = totalAppointments === 0 ? 0 : currentPage * PAGE_SIZE + 1;
        const end = totalAppointments === 0 ? 0 : Math.min(start + loadedCount - 1, totalAppointments);

        if (totalAppointments === 0) {
            pageInfo.textContent = 'Нет записей';
        } else {
            pageInfo.textContent = `Показаны ${start}–${end} из ${totalAppointments} • Страница ${currentPage + 1} из ${totalPages}`;
        }

        prevPageBtn.disabled = currentPage === 0;
        nextPageBtn.disabled = totalAppointments === 0 || currentPage + 1 >= totalPages;
    }

    function renderAppointments(appointments) {
        if (appointments.length === 0) {
            appointmentsBody.innerHTML = '<tr><td colspan="7" class="text-center">Нет записей</td></tr>';
            return;
        }

        appointmentsBody.innerHTML = appointments.map(app => {
            const appointmentDate = new Date(app.appointment_date);
            const dateStr = Number.isNaN(appointmentDate.getTime())
                ? '—'
                : appointmentDate.toLocaleDateString('ru-RU');
            const age = app.age !== null && app.age !== undefined ? `${app.age} лет` : '—';
            const patientId = Number(app.patient_id);
            const appointmentId = Number(app.appointment_id);

            return `
                <tr>
                    <td>${escapeHtml(app.patient_fio || '—')}</td>
                    <td>${escapeHtml(age)}</td>
                    <td>${escapeHtml(dateStr)}</td>
                    <td>${escapeHtml(app.doctor_fio || '—')}</td>
                    <td>${escapeHtml(app.location_name || '—')}</td>
                    <td>${escapeHtml(app.branch_name || '—')}</td>
                    <td>
                        <a href="/patient/${patientId}?appointment_id=${appointmentId}" class="btn btn-sm btn-outline-primary">Открыть карточку</a>
                    </td>
                </tr>
            `;
        }).join('');
    }

    async function loadAppointments() {
        if (appointmentsRequestController) {
            appointmentsRequestController.abort();
        }
        appointmentsRequestController = new AbortController();

        appointmentsBody.innerHTML = '<tr><td colspan="7" class="text-center">Загрузка данных...</td></tr>';
        setPaginationLoading();

        try {
            const response = await fetch(
                `/api/appointments/filtered?${buildAppointmentParams().toString()}`,
                {signal: appointmentsRequestController.signal}
            );
            if (!response.ok) {
                throw new Error(`Ошибка API: ${response.status}`);
            }

            const appointments = await response.json();
            totalAppointments = Number(response.headers.get('X-Total-Count') || appointments.length);
            renderAppointments(appointments);
            updatePagination(appointments.length);
        } catch (error) {
            if (error.name === 'AbortError') return;
            console.error(error);
            appointmentsBody.innerHTML = '<tr><td colspan="7" class="text-center text-danger">Ошибка загрузки данных</td></tr>';
            pageInfo.textContent = 'Не удалось загрузить список';
            prevPageBtn.disabled = true;
            nextPageBtn.disabled = true;
        }
    }

    async function applyFilters() {
        currentPage = 0;
        await loadAppointments();
    }

    branchSelect.addEventListener('change', async function() {
        locationSelect.value = '';
        doctorSelect.value = '';
        await updateLocations(false);
        await updateDoctors(false);
    });

    locationSelect.addEventListener('change', async function() {
        await updateDoctors(true);
    });

    doctorSelect.addEventListener('change', async function() {
        await updateLocations(true);
    });

    async function resetFilters() {
        branchSelect.value = '';
        doctorSelect.value = '';
        searchInput.value = '';
        periodSelect.value = 'all';
        locationSelect.disabled = true;
        fillSelect(locationSelect, [], 'Сначала выберите филиал', item => item.name);
        currentPage = 0;
        await updateDoctors(false);
        await loadAppointments();
    }

    document.getElementById('filterBtn').addEventListener('click', applyFilters);
    document.getElementById('resetBtn').addEventListener('click', resetFilters);

    prevPageBtn.addEventListener('click', async function() {
        if (currentPage === 0) return;
        currentPage -= 1;
        await loadAppointments();
        window.scrollTo({top: 0, behavior: 'smooth'});
    });

    nextPageBtn.addEventListener('click', async function() {
        const totalPages = Math.ceil(totalAppointments / PAGE_SIZE);
        if (currentPage + 1 >= totalPages) return;
        currentPage += 1;
        await loadAppointments();
        window.scrollTo({top: 0, behavior: 'smooth'});
    });

    document.querySelector('.card.mb-4').addEventListener('keydown', function(event) {
        if (event.key === 'Enter') {
            event.preventDefault();
            applyFilters();
        }
    });

    updateDoctors(false);
    loadAppointments();
</script>

<script>
    // Сортировка видимых 100 строк. Общая последовательность страниц задаётся сервером.
    document.addEventListener('DOMContentLoaded', function() {
        const table = document.querySelector('.table');
        const headers = table.querySelectorAll('thead th');
        const tbody = table.querySelector('tbody');
        const columns = {
            0: 'patient_fio',
            1: 'age',
            2: 'appointment_date',
            3: 'doctor_fio'
        };
        const sortDirection = {};

        headers.forEach((header, index) => {
            const originalText = header.textContent.trim();
            if (!(index in columns)) return;

            header.innerHTML = '';
            header.style.cursor = 'pointer';
            header.style.userSelect = 'none';
            header.style.whiteSpace = 'nowrap';

            const textSpan = document.createElement('span');
            textSpan.textContent = originalText;
            textSpan.style.display = 'inline-block';
            header.appendChild(textSpan);

            const arrowContainer = document.createElement('span');
            arrowContainer.style.display = 'inline-flex';
            arrowContainer.style.flexDirection = 'column';
            arrowContainer.style.marginLeft = '8px';
            arrowContainer.style.fontSize = '10px';
            arrowContainer.style.lineHeight = '1';
            arrowContainer.style.verticalAlign = 'middle';

            const arrowUp = document.createElement('span');
            arrowUp.textContent = '▲';
            arrowUp.style.color = '#aaa';
            arrowUp.style.display = 'block';
            arrowUp.style.textAlign = 'center';
            arrowUp.title = 'Сортировать видимую страницу по возрастанию';

            const arrowDown = document.createElement('span');
            arrowDown.textContent = '▼';
            arrowDown.style.color = '#aaa';
            arrowDown.style.display = 'block';
            arrowDown.style.textAlign = 'center';
            arrowDown.title = 'Сортировать видимую страницу по убыванию';

            arrowContainer.appendChild(arrowUp);
            arrowContainer.appendChild(arrowDown);
            header.appendChild(arrowContainer);

            function sortTable(direction) {
                const rows = Array.from(tbody.querySelectorAll('tr')).filter(row => row.cells.length > index);
                const columnName = columns[index];

                rows.sort((a, b) => {
                    const aVal = a.cells[index].textContent.trim();
                    const bVal = b.cells[index].textContent.trim();

                    if (columnName === 'appointment_date') {
                        const aDate = new Date(aVal.split('.').reverse().join('-'));
                        const bDate = new Date(bVal.split('.').reverse().join('-'));
                        return direction === 'asc' ? aDate - bDate : bDate - aDate;
                    }
                    if (columnName === 'age') {
                        const aNum = parseInt(aVal) || 0;
                        const bNum = parseInt(bVal) || 0;
                        return direction === 'asc' ? aNum - bNum : bNum - aNum;
                    }
                    return direction === 'asc'
                        ? aVal.localeCompare(bVal, 'ru')
                        : bVal.localeCompare(aVal, 'ru');
                });

                rows.forEach(row => tbody.appendChild(row));
                sortDirection[index] = direction;
            }

            function updateArrows(activeDirection) {
                headers.forEach(item => {
                    const container = item.querySelector('span:last-child');
                    if (!container) return;
                    if (container.children[0]) container.children[0].style.color = '#aaa';
                    if (container.children[1]) container.children[1].style.color = '#aaa';
                });
                arrowUp.style.color = activeDirection === 'asc' ? '#ffcc00' : '#aaa';
                arrowDown.style.color = activeDirection === 'desc' ? '#ffcc00' : '#aaa';
            }

            arrowUp.addEventListener('click', event => {
                event.stopPropagation();
                sortTable('asc');
                updateArrows('asc');
            });
            arrowDown.addEventListener('click', event => {
                event.stopPropagation();
                sortTable('desc');
                updateArrows('desc');
            });
            textSpan.addEventListener('click', event => {
                event.stopPropagation();
                const direction = sortDirection[index] === 'asc' ? 'desc' : 'asc';
                sortTable(direction);
                updateArrows(direction);
            });
        });
    });
</script>
{% endblock %}
