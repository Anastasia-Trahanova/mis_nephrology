{# Нижняя панель экспорта карточки приёма. #}

<div class="card-footer d-flex flex-wrap gap-2">
  <a href="/export/{{ selected_appointment.id }}/docx" class="btn btn-primary">
    Скачать Word
  </a>

  {% if selected_appointment.is_archive_import and selected_appointment.archive_source_relative_path %}
  <a href="/export/{{ selected_appointment.id }}/archive-source" class="btn btn-outline-primary">
    Скачать исходный документ
  </a>
  {% endif %}
</div>
